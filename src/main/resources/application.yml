spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/webframework?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:webframework}
    password: ${DB_PASSWORD:local-dev-password}
  jpa:
    hibernate:
      ddl-auto: update
      open-in-view: false
      properties:
        hibernate:
          format_sql: true
server:
  port: 8080

jwt:
  # Base64 인코딩된 32바이트 이상 키입니다. 운영 환경에서는 반드시 JWT_SECRET으로 덮어쓰세요.
  secret: ${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600}
